services:
  - type: web
    name: fintrack-project
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn fintrack_project.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fintrack_db
          property: connectionString
      - key: DEBUG
        value: False
      - key: DJANGO_SECRET_KEY
        value: TEBGLI@49360602