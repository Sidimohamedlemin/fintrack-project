services:
  - type: web
    name: fintrack-project
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn fintrack_project.wsgi"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fintrack-db
          property: connectionString
    autoDeploy: true

    
    preDeployCommand: "python manage.py migrate"